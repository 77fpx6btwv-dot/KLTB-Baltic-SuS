<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="author" content="Gabor Schütt">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#dceff5">
<title>KLTB Baltic – Schüler:innenversion</title>
<style>
:root{
  --ink:#20343b;--muted:#66777d;--line:#d7e3e7;--soft:#f4f9fa;
  --blue:#8fc7d8;--blue2:#dceff5;--green:#78b99b;--yellow:#e3c56b;
  --red:#d9958f;--white:#fff;--shadow:0 5px 20px rgba(35,65,75,.08);
}
*{box-sizing:border-box}
body{margin:0;background:#f7fafb;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{max-width:980px;margin:auto;padding:14px 14px 40px}
header{background:linear-gradient(120deg,rgba(220,239,245,.94),rgba(247,250,251,.98));border:1px solid #cfe2e8;border-radius:18px;padding:15px 17px;box-shadow:var(--shadow)}
.brand{display:flex;justify-content:space-between;gap:15px;align-items:center}
.brand-left{display:flex;align-items:center;gap:11px}
.logo-svg-box{width:40px;height:36px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.logo-svg-box img{max-width:40px;max-height:36px;object-fit:contain}
h1{font-size:1.28rem;margin:0 0 3px;font-weight:800}
.sub{font-size:.83rem;color:var(--muted)}
.topbar{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:13px}
.topbar .btn{width:100%;text-align:center;white-space:nowrap}
.topbar .btn.wide{grid-column:1/-1}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 13px;border-radius:11px;font-weight:700}
.btn.primary{background:#e2f1f5;border-color:#b9d9e2}
.btn.small{padding:7px 10px;font-size:.84rem}
.btn.danger{border-color:#e7c0bd;background:#fff7f6}
main{margin-top:13px}
.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:16px;box-shadow:var(--shadow);margin-bottom:13px}
.card h2{font-size:1rem;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.field label{display:block;font-size:.76rem;font-weight:800;color:var(--muted);margin:0 0 5px}
input,select,textarea{width:100%;border:1px solid #cddde2;border-radius:10px;background:#fff;padding:10px;color:var(--ink);outline:none}
input:focus,select:focus,textarea:focus{border-color:#86bfd0;box-shadow:0 0 0 3px rgba(134,191,208,.16)}
textarea{min-height:88px;resize:vertical}
.full{grid-column:1/-1}
.entry{border:1px solid var(--line);border-radius:15px;padding:13px;margin-top:10px;background:#fcfefe}
.entry-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.subject{display:inline-block;padding:4px 8px;border-radius:999px;background:var(--blue2);font-size:.73rem;font-weight:800}
.task{font-weight:800;margin:7px 0 2px}
.meta{font-size:.78rem;color:var(--muted)}
.timer{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:11px}
.time{font-variant-numeric:tabular-nums;font-weight:900;font-size:1.05rem;min-width:74px}
.status{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap}
.dot{width:34px;height:34px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #ccd9dd}
.dot.active{box-shadow:0 0 0 3px #5f7278}
.green{background:#9acaae}.yellow{background:#ead27f}.red{background:#dfa29c}
.feedback-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin:7px 0}
.quick button{border:1px solid #d7e3e7;background:#f7fafb;border-radius:999px;padding:7px 9px;font-size:.76rem;text-align:left}
.quick button:hover{background:#edf6f8}
.quick button.gewaehlt{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.hint{font-size:.76rem;color:var(--muted);line-height:1.4}
.history-item{padding:10px 0;border-top:1px solid var(--line)}
.history-item:first-child{border-top:0}
.empty{padding:18px;text-align:center;color:var(--muted);font-size:.85rem;background:var(--soft);border-radius:12px}
.modal-back{position:fixed;inset:0;background:rgba(20,40,45,.38);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal-back.open{display:flex}
.modal{background:#fff;border-radius:18px;max-width:620px;width:100%;max-height:90vh;overflow:auto;padding:18px;box-shadow:0 18px 60px rgba(0,0,0,.2)}
.modal h2{margin-top:0}
.notice{padding:10px 12px;border-radius:11px;background:#f1f7f8;border:1px solid #d5e5e9;font-size:.8rem;line-height:1.45}
.notice.warn{background:#fdecea;border-color:#f3b9b0;color:#8a2f22}
footer{text-align:center;color:#7a8b90;font-size:.72rem;padding:10px}
@media(max-width:700px){
  .grid,.feedback-grid{grid-template-columns:1fr}
  .app{padding:9px 9px 30px}
  header,.card{border-radius:14px;padding:13px}
  .brand{align-items:flex-start}
}
</style>
</head>

<script>
/* ==========================================================================
   KLTB Baltic – Schüler:innenversion (Alternative zur gemeinsamen Klassentafel
   für SuS mit eigenem Handy, Android oder iOS)
   © Gabor Schütt · Stand: 29.09.2026
   v0.2: Zeiterfassung robust (1 Timer gleichzeitig, Höchstdauer, Zeitfenster, Zeitkorrektur,
   Tagesabschluss), Summen, Komfort (Vorbelegung, Partner-Favoriten), Export mit berechneten Minuten.
   Eigenständige persönliche Lern-App (KEINE abgespeckte LK-Version):
   - Eine identische HTML-Datei für alle SuS.
   - Persönliche Daten liegen primär im localStorage dieses Geräts/Browsers
     (kein tägliches Datei-Ritual nötig, anders als bei geteilten Geräten).
   - "Meine Daten sichern" erzeugt zusätzlich eine JSON-Datei zum Hochladen
     in itslearning oder Versenden an die Lehrkraft – als Sicherung/Nachweis,
     nicht als täglicher Pflichtschritt.
   - Keine Aufgabenbibliothek, keine Klassenliste, keine LK-Funktionen.
   v0.4: Aufgaben-Auswahl je Fach (ABs nur des gewählten Fachs, typische Aufgaben, Freie Eingabe), Sonstiges (Klassendienst, Fach/Ranzen aufräumen), Standardgruppen
   v0.3: ⚡ Kurz-Check (selbstkorrigierend, aus Kurz-Check-Paketen der Lehrkraft, nur LESEND eingebunden, mit Selbsteinschätzung vorab)
   und 🎙 Erklär-Aufnahme (max. 60 s, Audio bleibt auf dem Gerät in IndexedDB, nicht in der JSON-Datei).
   Bewusst NICHT enthalten: Fachpaket-Import, Lernpfad-Engine, LK-Cockpit,
   itslearning-API-Anbindung, Serveranbindung. Ein späteres Fach-/Jahrgangs-
   paket würde – falls es kommt – nur LESEND eingebunden; dafür ist hier
   bewusst noch nichts vorbereitet, um die App klein zu halten.
   ========================================================================== */
const VERSION="BALTIC-KLTB-SUS-0.3";
const SUBJECTS=["Naturwissenschaften","Biologie","Chemie","Physik","Informatik","Technik","Mathematik","Geschichte","Weltkunde","Wirtschaft/Politik","Religion/Philosophie","Deutsch","Englisch","Französisch","Spanisch","Latein","Dänisch","Sport","Musik","Kunst","Darstellendes Spiel","Gestalten","WP 1","WP 2","Projektarbeit","Sonstiges"];
const LOCATIONS=["Klasse","Insel","Flur","Diff-Raum","Blauer Tisch","Treppe/Aula","Schulhof","Computerraum","Mensa","Mediothek","Kunst-Gebäude","Aula","Lehrerzimmer"];
const QUICK_GOOD=[
"Ich konnte konzentriert arbeiten.",
"Ich habe in einem guten Tempo gearbeitet.",
"Ich wusste, was ich tun soll.",
"Ich habe selbstständig weitergearbeitet.",
"Ich habe gut mit anderen zusammengearbeitet."
];
const QUICK_NEXT=[
"Ich möchte mich besser konzentrieren.",
"Ich möchte früher mit der Arbeit beginnen.",
"Ich möchte bei Schwierigkeiten erst selbst probieren.",
"Ich möchte leiser arbeiten.",
"Ich möchte mir die Aufgabenmenge besser einteilen."
];
const QUICK_HIND=[
"Ich wurde oft von anderen abgelenkt.",
"Ich habe die Aufgabe nicht richtig verstanden.",
"Mir hat Material oder ein Hilfsmittel gefehlt.",
"Ich musste zu lange auf Hilfe warten.",
"Ich war müde oder unkonzentriert.",
"Es war mir zu laut zum Arbeiten.",
"Ich hatte Streit oder Ärger mit jemandem.",
"Die Aufgabe war für mich zu schwer."
];
const QUICK_KI_WOFUER=[
"Rechtschreibung/Grammatik prüfen",
"Ideen sammeln / Brainstorming",
"Erklärung zum Thema verstehen",
"Text zusammenfassen",
"Beispielaufgabe erstellen",
"Übersetzung"
];

let db={
  version:VERSION,
  schueler:{vorname:"",nachname:"",klasse:""},
  tage:{},
  pakete:[],checks:[],audio:[],
  einst:{fensterEnde:"",maxMinuten:180,letztesFach:"",letzterOrt:"",gruppen:[]},
  meta:{erstellt:new Date().toISOString(),geaendert:new Date().toISOString(),letzteSicherung:null}
};
let currentDate=todayStr();
let activeTimer=null;
let timerTick=null;
let dirty=false;
let onboardingGezeigt=false;

function dStr(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function todayStr(){return dStr(new Date())} // lokales Datum (nicht UTC)
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
// Sicheres Einbetten eines JS-Strings in ein HTML-onclick-Attribut:
// JSON.stringify() erzeugt Anführungszeichen, die das umschließende
// HTML-Attribut (ebenfalls in "...") sonst vorzeitig beenden würden.
function attrJson(v){return esc(JSON.stringify(v))}
function fmtDate(s){const d=new Date(s+"T12:00:00");return d.toLocaleDateString("de-DE",{weekday:"long",day:"2-digit",month:"2-digit",year:"numeric"})}
function fmtDateShort(s){const d=new Date(s+"T12:00:00");return d.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"})}
function mins(n){n=Math.max(0,Math.round(n||0));return `${Math.floor(n/60)}:${String(n%60).padStart(2,"0")}`}
function leereRueckmeldung(){return {gut:"",naechstesMal:"",hindernisse:"",kiNutzung:{genutzt:"",wofuer:"",hilfeWarum:""}}}
function ensureDay(date=currentDate){
  if(!db.tage[date]) db.tage[date]={eintraege:[],tagesrueckmeldung:leereRueckmeldung()};
  if(!db.tage[date].eintraege) db.tage[date].eintraege=[];
  if(!db.tage[date].tagesrueckmeldung) db.tage[date].tagesrueckmeldung=leereRueckmeldung();
  // Absicherung für Dateien aus älteren Versionen ohne KI-Feld (Migration):
  if(!db.tage[date].tagesrueckmeldung.kiNutzung) db.tage[date].tagesrueckmeldung.kiNutzung={genutzt:"",wofuer:"",hilfeWarum:""};
  return db.tage[date];
}
// Beim Laden einer Datei alle Tage einmal absichern, nicht erst beim Ansehen.
function migriereAlteDatei(p){
  Object.keys(p.tage||{}).forEach(date=>{
    const d=p.tage[date];
    if(!d.eintraege)d.eintraege=[];
    d.eintraege.forEach(e=>{
      if(!e.id)e.id=newId();
      if(e.gesamtMs==null)e.gesamtMs=0;
    });
    if(!d.tagesrueckmeldung)d.tagesrueckmeldung=leereRueckmeldung();
    if(!d.tagesrueckmeldung.kiNutzung)d.tagesrueckmeldung.kiNutzung={genutzt:"",wofuer:"",hilfeWarum:""};
  });
  if(!Array.isArray(p.pakete))p.pakete=[];
  if(!Array.isArray(p.checks))p.checks=[];
  if(!Array.isArray(p.audio))p.audio=[];
  if(!p.meta)p.meta={erstellt:new Date().toISOString(),geaendert:new Date().toISOString()};
  if(p.meta.letzteSicherung===undefined)p.meta.letzteSicherung=null;
  p.einst=Object.assign({fensterEnde:"",maxMinuten:180,letztesFach:"",letzterOrt:"",gruppen:[]},p.einst||{});if(!Array.isArray(p.einst.gruppen))p.einst.gruppen=[];
  return p;
}
function newId(){return Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,7)}
const LOCAL_KEY="kltb_baltic_sus_v1";
function persistLocal(){
  try{localStorage.setItem(LOCAL_KEY,JSON.stringify(db));return true}
  catch(e){return false}
}
function ladeLocal(){
  try{
    const raw=localStorage.getItem(LOCAL_KEY);if(!raw)return null;
    const p=JSON.parse(raw);if(!p||!p.tage||!p.schueler)return null;
    migriereAlteDatei(p);return p;
  }catch(e){return null}
}
let lokalSpeichernFehlgeschlagen=false;
function setDirty(){
  db.meta.geaendert=new Date().toISOString();
  const okLocal=persistLocal();
  dirty=!okLocal; // "dirty" heißt hier: konnte nicht einmal lokal auf dem Gerät gespeichert werden
  lokalSpeichernFehlgeschlagen=!okLocal;
}
function setSaved(){
  // Nach dem Laden einer (fremden/externen) Datei: sie wird die neue lokale Arbeitsgrundlage.
  dirty=!persistLocal();
  lokalSpeichernFehlgeschlagen=dirty;
}
function tageMitSicherung(){
  if(!db.meta.letzteSicherung)return null;
  return Math.floor((Date.now()-new Date(db.meta.letzteSicherung).getTime())/86400000);
}
function renderSicherungshinweis(){
  if(lokalSpeichernFehlgeschlagen){
    return `<div class="notice warn" style="margin-bottom:11px">⚠️ Deine Eingaben konnten gerade nicht automatisch auf diesem Gerät gespeichert werden. Bitte jetzt „Meine Daten sichern“ nutzen, damit nichts verloren geht!</div>`;
  }
  const irgendwasErfasst=Object.keys(db.tage).length>0;
  if(!irgendwasErfasst)return"";
  const tage=tageMitSicherung();
  if(tage===null){
    return `<div class="notice" style="margin-bottom:11px">🕐 Du hast deine Daten noch nie extern gesichert. Nutze „Meine Daten sichern“ und lade die Datei in itslearning hoch oder schicke sie deiner Lehrkraft – falls dein Handy verloren geht oder der Browser-Speicher gelöscht wird, sind deine Eintragungen sonst weg.</div>`;
  }
  if(tage>=7){
    return `<div class="notice" style="margin-bottom:11px">🕐 Deine letzte Sicherung ist ${tage} Tage her. Zeit für ein Update: „Meine Daten sichern“ und die Datei in itslearning hochladen oder an deine Lehrkraft schicken.</div>`;
  }
  return"";
}
function openToday(){closeModal();currentDate=todayStr();renderToday()}
function renderToday(){
  const d=ensureDay();
  // Eingaben im Formular überleben ein Neuzeichnen (z. B. Klick auf KI-Ja/Nein):
  const _vor={};["newTask","newPartner","newSubject","newLocation","newTaskSel"].forEach(k=>{const el=document.getElementById(k);if(el)_vor[k]=el.value});
  const first=!db.schueler.vorname&&!db.schueler.nachname;
  if(first && !onboardingGezeigt){setTimeout(()=>openOnboarding(),80);}
  const entries=d.eintraege;
  document.getElementById("main").innerHTML=`
  <section class="card">
    <h2>${fmtDate(currentDate)}</h2>
    ${renderSicherungshinweis()}
    <div class="notice">Du dokumentierst hier nur, <b>woran du tatsächlich gearbeitet hast</b>. Die eigentliche Aufgabe liegt in itslearning oder als Kopie vor. Trage sie unten konkret ein.</div>
  </section>
  ${renderOpenTasks()}
  ${renderNeuePhase()}
  <section class="card">
    <h2>Heute <span class="hint" id="tagSumme">· insgesamt ${mins(tagesSumme(currentDate))} h</span></h2>
    <div id="entries">${entries.length?entries.map(renderEntry).join(""):`<div class="empty">Noch keine Arbeitsphase dokumentiert.</div>`}</div>
  </section>
  <section class="card">
    <h2>🌱 Tagesrückmeldung</h2>
    ${feedbackField("gut","🟢 Was lief gut?",QUICK_GOOD,d.tagesrueckmeldung.gut)}
    ${feedbackField("naechstesMal","🔵 Was nehme ich mir für das nächste Mal vor?",QUICK_NEXT,d.tagesrueckmeldung.naechstesMal)}
    ${feedbackField("hindernisse","🚧 Welche Hindernisse gab es?",QUICK_HIND,d.tagesrueckmeldung.hindernisse)}
    ${renderKI(d.tagesrueckmeldung.kiNutzung)}
  </section>`;
  Object.entries(_vor).forEach(([k,v])=>{if(k==="newTaskSel")return;const el=document.getElementById(k);if(el&&v!=="")el.value=v});aufgabenFuellen(_vor.newTaskSel);
  updateTimers();
}
function renderOpenTasks(){
  const open=[];
  const heute=ensureDay().eintraege;
  Object.entries(db.tage).forEach(([date,d])=>{
    if(date===currentDate)return;
    (d.eintraege||[]).forEach(e=>{
      if(e.status==='fertig')return;
      // Schon heute weitergeführt? Dann hier nicht nochmal anbieten (kein Duplikat).
      const schonFortgesetzt=heute.some(h=>h.fortsetzungVon&&h.fortsetzungVon.id===e.id);
      if(schonFortgesetzt)return;
      open.push({date,e});
    });
  });
  if(!open.length)return '';
  return `<section class="card"><h2>↩️ Offene Arbeitsphasen</h2>
    <div class="hint" style="margin-bottom:9px">Hier kannst du eine Aufgabe von einem früheren Tag heute weiterführen. Die ursprüngliche Dokumentation bleibt erhalten.</div>
    ${open.slice(-8).reverse().map(x=>`<div class="entry" style="margin-top:8px">
      <span class="subject">${esc(x.e.fach)}</span>
      <div class="task">${esc(x.e.aufgabe)}</div>
      <div class="meta">vom ${fmtDate(x.date)}${x.e.partner?' · 👥 '+esc(x.e.partner):''}</div>
      <button class="btn small primary" style="margin-top:8px" onclick="continueEntry('${esc(x.date)}','${esc(x.e.id)}')">▶ Heute weiterarbeiten</button>
    </div>`).join('')}
  </section>`;
}
function continueEntry(date,id){
  const old=(db.tage[date]?.eintraege||[]).find(e=>e.id===id);if(!old)return;
  pauseAlleLaufenden();
  // Alte Phase sauber abschließen: keine weiterlaufende Zeit, taucht morgen nicht erneut als "offen" auf.
  old.arbeitszeitMinuten=Math.round((old.gesamtMs||0)/60000);old.status="fertig";old.fortgesetztAm=todayStr();
  const e={id:newId(),fach:old.fach,ort:old.ort,aufgabe:old.aufgabe,partner:old.partner,status:'läuft',gestartetAt:Date.now(),aktiveSeit:Date.now(),gesamtMs:0,lernstand:'',lerncheck:'',fortsetzungVon:{datum:date,id:id}};
  ensureDay().eintraege.push(e);activeTimer=e.id;setDirty();renderToday();
}
function anhaengen(bisher,satz){
  bisher=(bisher||"").trim();
  if(!satz)return bisher;
  if(bisher.includes(satz))return bisher; // schon enthalten -> nicht doppelt anhängen (Klick = Auswahl, kein Duplikat-Spam)
  return bisher?bisher+" "+satz:satz;
}

}

function chooseFeedback(key,v,btn){const d=ensureDay();d.tagesrueckmeldung[key]=anhaengen(d.tagesrueckmeldung[key],v);setDirty();const ta=document.getElementById("fb_"+key);if(ta)ta.value=d.tagesrueckmeldung[key];markiereChip(btn)}

function chooseKi(key,v,btn){const d=ensureDay();d.tagesrueckmeldung.kiNutzung[key]=anhaengen(d.tagesrueckmeldung.kiNutzung[key],v);setDirty();const ta=document.getElementById("ki_wofuer");if(ta&&key==="wofuer")ta.value=d.tagesrueckmeldung.kiNutzung[key];markiereChip(btn)}

  const running=e.status==="läuft";

  const statusClass=e.lernstand||"";
  return `<div class="entry">
    <div class="entry-head">
      <div>
        <span class="subject">${esc(e.fach)}</span>
        <div class="task">${esc(e.aufgabe||"—")}</div>
        <div class="meta">${e.ort?esc(e.ort):""}${e.partner?" · 👥 "+esc(e.partner):""}${e.fortsetzungVon?" · ↩️ Fortsetzung vom "+esc(fmtDateShort(e.fortsetzungVon.datum)):""}</div>
      </div>
      <button class="btn small danger" onclick="deleteEntry('${e.id}')">Löschen</button>
    </div>
    <div class="timer">
      <span class="time" id="timer_${e.id}">${mins(calcMinutes(e))}</span><button class="btn small" title="Zeit korrigieren" onclick="openZeitKorr('${e.id}')">🕑</button>${e.zeitKorrigiert?'<span class="hint">✎ korrigiert</span>':''}${e.autoBeendet||e.autoBegrenzt?'<span class="hint">⏱ automatisch begrenzt</span>':''}
      ${running?`<button class="btn small" onclick="pauseEntry('${e.id}')">⏸ Pause</button>`:
        paused?`<button class="btn small primary" onclick="resumeEntry('${e.id}')">▶ Weiter</button>`:
        e.status==="fertig"?`<span class="hint">fertig</span>`:`<button class="btn small primary" onclick="resumeEntry('${e.id}')">▶ Start</button>`}
      ${running||paused?`<button class="btn small" onclick="finishEntry('${e.id}')">✓ Fertig</button>`:""}
    </div>
    <div class="status">
      <span class="hint" style="align-self:center">Wie lief es?</span>
      ${["green","yellow","red"].map(c=>`<button aria-label="${c}" class="dot ${c} ${statusClass===c?"active":""}" onclick="setLearningStatus('${e.id}','${c}')"></button>`).join("")}
    </div>
    <div class="grid" style="margin-top:11px">
      <!-- Bewusst ohne eigenen Timer: der Lerncheck darf die Arbeitszeit
           oben nicht verlängern, solange er nicht als eigene Arbeitsphase
           dokumentiert wird. -->
      <div class="field full"><label>🧠 Lerncheck: Was kann ich jetzt? / Was habe ich heute verstanden? (optional)</label><textarea style="min-height:62px" oninput="setEntryField('${e.id}','lerncheck',this.value)" placeholder="Kurze eigene Antwort oder Erkenntnis">${esc(e.lerncheck||"")}</textarea></div>

function addEntry(){
  const sel=document.getElementById("newTaskSel").value;
  if(!sel){alert("Bitte wähle zuerst aus, woran du arbeitest.");return}
  let task=sel;
  if(sel===FREI_AUFG){task=document.getElementById("newTask").value.trim();
    if(!task){alert("Bitte trage zuerst konkret ein, woran du arbeitest.");document.getElementById("newTask").focus();return}}
  const fach=document.getElementById("newSubject").value,ort=document.getElementById("newLocation").value;
  pauseAlleLaufenden();
  const e={id:newId(),fach,ort,aufgabe:task,partner:document.getElementById("newPartner").value.trim(),status:"läuft",
    gestartetAt:Date.now(),aktiveSeit:Date.now(),gesamtMs:0,lernstand:"",lerncheck:""};
  db.einst.letztesFach=fach;db.einst.letzterOrt=ort;
  ensureDay().eintraege.push(e);activeTimer=e.id;setDirty();renderToday();
}
function getEntry(id){return ensureDay().eintraege.find(e=>e.id===id)}
function maxMs(){return Math.max(15,+db.einst.maxMinuten||180)*60000}
// Laufender Abschnitt, gedeckelt auf die Höchstdauer je Arbeitsphase (schützt vor vergessenen Timern).
function laufSegmentMs(e){
  if(e.status!=="läuft"||!e.aktiveSeit)return 0;
  const rest=Math.max(0,maxMs()-(e.gesamtMs||0));
  return Math.min(Math.max(0,Date.now()-e.aktiveSeit),rest);
}
function calcMinutes(e){
  // Pausenzeiten zählen nie mit: gesamtMs enthält nur abgeschlossene Abschnitte.
  if(e.status==="läuft"&&e.aktiveSeit)return Math.round(((e.gesamtMs||0)+laufSegmentMs(e))/60000);
  if(e.gesamtMs!=null)return Math.round(e.gesamtMs/60000);
  return e.arbeitszeitMinuten||0;
}
function minutenVon(e){return (e.status==="fertig"&&e.arbeitszeitMinuten!=null)?e.arbeitszeitMinuten:calcMinutes(e)}
// Beendet den laufenden Abschnitt (optional zu einem bestimmten Zeitpunkt), immer gedeckelt.
function schliesseSegment(e,endeTs){
  if(e.status!=="läuft"||!e.aktiveSeit)return;
  const rest=Math.max(0,maxMs()-(e.gesamtMs||0));
  const roh=Math.max(0,(endeTs!=null?endeTs:Date.now())-e.aktiveSeit);
  if(roh>rest)e.autoBegrenzt=true;
  e.gesamtMs=(e.gesamtMs||0)+Math.min(roh,rest);e.aktiveSeit=null;
}
// Es läuft immer nur EIN Timer (auch über Tage hinweg) – verhindert doppelt gezählte Zeit.
function pauseAlleLaufenden(ausser){
  Object.values(db.tage).forEach(d=>(d.eintraege||[]).forEach(e=>{
    if(e.id!==ausser&&e.status==="läuft"){schliesseSegment(e);e.status="pausiert"}
  }));
}
function pauseEntry(id){
  const e=getEntry(id);if(!e||e.status!=="läuft")return;
  schliesseSegment(e);e.status="pausiert";activeTimer=null;setDirty();renderToday();
}
function resumeEntry(id){
  const e=getEntry(id);if(!e||e.status==="fertig"||e.status==="läuft")return;
  pauseAlleLaufenden(id);
  e.status="läuft";e.aktiveSeit=Date.now();activeTimer=id;setDirty();renderToday();
}
function finishEntry(id){
  const e=getEntry(id);if(!e)return;
  schliesseSegment(e);
  e.arbeitszeitMinuten=Math.round((e.gesamtMs||0)/60000);e.status="fertig";e.fertigAt=Date.now();
  if(activeTimer===id)activeTimer=null;setDirty();renderToday();
}
function setLearningStatus(id,c){const e=getEntry(id);if(e){e.lernstand=c;setDirty();renderToday()}}
function setEntryField(id,key,v){const e=getEntry(id);if(e){e[key]=v;setDirty()}}
function deleteEntry(id){
  if(!confirm("Diese Arbeitsphase wirklich löschen?"))return;
  ensureDay().eintraege=ensureDay().eintraege.filter(e=>e.id!==id);if(activeTimer===id)activeTimer=null;setDirty();renderToday();
}
function tagesSumme(date){return ((db.tage[date]&&db.tage[date].eintraege)||[]).reduce((s,e)=>s+minutenVon(e),0)}
function updateTimers(){
  clearInterval(timerTick);
  timerTick=setInterval(()=>{
    if(!document.getElementById("entries"))return;
    ensureDay().eintraege.filter(e=>e.status==="läuft").forEach(e=>{
      const el=document.getElementById("timer_"+e.id);if(el)el.textContent=mins(calcMinutes(e));
    });
    const ts=document.getElementById("tagSumme");if(ts)ts.textContent="· insgesamt "+mins(tagesSumme(currentDate))+" h";
  },1000);
}

  </section>
  <section class="card"><h2>📚 Mein Verlauf</h2>
  ${dates.length?dates.map(date=>{

      ${(d.eintraege||[]).map(e=>`<div class="meta" style="margin-top:5px">• <b>${esc(e.fach)}</b> · ${esc(e.aufgabe)} · ${minutenVon(e)} Min.${e.zeitKorrigiert?" ✎":""}${e.lernstand?` · ${e.lernstand==="green"?"🟢":e.lernstand==="yellow"?"🟡":"🔴"}`:""}</div>`).join("")}
      ${d.tagesrueckmeldung?.gut?`<div class="meta" style="margin-top:6px">🟢 ${esc(d.tagesrueckmeldung.gut)}</div>`:""}

    </div>`}).join(""):`<div class="empty">Noch keine gespeicherten Tage.</div>`}

// Speichert eine Datei über den zuverlässigsten verfügbaren Weg – wichtig, weil
// eingebettete Vorschauen (z.B. Documents-App) den klassischen Browser-Download
// (Blob + <a download>) teils nicht sauber unterstützen (speichert dann sichtbar
// "in die HTML" statt eine eigene Datei zu erzeugen). Reihenfolge:
// 1) Hosting-Umgebung mit eigenem Speichern-Dialog (falls vorhanden)
// 2) Geräte-eigene "Teilen"-Funktion (Web Share API) – läuft über das Betriebssystem,
//    nicht über den Browser, und funktioniert deshalb auch in vielen restriktiven
//    Vorschauen; Nutzer:in wählt dort z.B. "In Dateien sichern" oder itslearning direkt.
// 3) Klassischer Browser-Download als letzter Fallback (z.B. in echtem Safari/Chrome).
async function speichereDatei(json,filename){
  try{
    if(window.claude && typeof window.claude.use==="function"){
      const downloads=await window.claude.use("downloads");
      if(downloads){await downloads.save({filename,data:json});return true;}
    }
  }catch(err){
    if(err&&err.code==="declined")return false; // Nutzer:in hat abgebrochen -> nicht als "gesichert" zählen
    // sonst (z.B. "unavailable"): unten weiter versuchen
  }
  try{
    if(navigator.canShare && navigator.share){
      const file=new File([json],filename,{type:"application/json"});
      if(navigator.canShare({files:[file]})){
        await navigator.share({files:[file]});
        return true;
      }
    }
  }catch(err){
    if(err&&err.name==="AbortError")return false; // Teilen-Dialog abgebrochen -> nicht als "gesichert" zählen
    // sonst: API vorhanden aber fehlgeschlagen -> unten der klassische Download-Fallback
  }
  try{
    const file=new Blob([json],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=filename;a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    return true;
  }catch(err2){return false;}
}
function saveJSON(){
  const json=JSON.stringify(exportDb(),null,2);
  const name=[db.schueler.vorname,db.schueler.nachname].filter(Boolean).join("_")||"SuS";
  speichereDatei(json,`KLTB_Baltic_${name}.json`).then(ok=>{if(ok)markiereGesichert();});
}
function downloadBackup(){
  const json=JSON.stringify(exportDb(),null,2);
  const name=[db.schueler.vorname,db.schueler.nachname].filter(Boolean).join("_")||"SuS";
  const stamp=new Date().toISOString().slice(0,16).replace(/[T:]/g,"-");
  speichereDatei(json,`KLTB_Baltic_${name}_Sicherung_${stamp}.json`).then(ok=>{if(ok)markiereGesichert();});
}
function loadJSON(event){
  const f=event.target.files?.[0];if(!f)return;
  const hatSchonDaten=Object.keys(db.tage).length>0||db.schueler.vorname;
  if(hatSchonDaten && !confirm("Auf diesem Gerät sind schon Daten gespeichert. Wenn du jetzt eine andere Datei lädst, werden diese hier ersetzt. Fortfahren?")){event.target.value="";return}
  const r=new FileReader();
  r.onload=()=>{
    try{
      const p=JSON.parse(r.result);
      if(!p||!p.tage||!p.schueler)throw new Error("Keine KLTB-SuS-Datei");
      if(p.tage&&typeof p.tage!=='object')throw new Error("Ungültige Tage");
      if(p.version && !String(p.version).startsWith("BALTIC-KLTB-SUS-"))throw new Error("Falsche KLTB-Datei");
      migriereAlteDatei(p);
      p.version=VERSION;
      db=p;currentDate=todayStr();setSaved();bereinigeAlteTimer();renderToday();
    }catch(err){alert("Die Datei konnte nicht als persönliche KLTB-SuS-Datei geladen werden.")}
  };
  r.readAsText(f);event.target.value="";
}

const FREI_AUFG="Freie Eingabe …";
const AUFG_STANDARD=["📝 Vorbereiten","🔁 Nacharbeiten","📋 Hausaufgaben","✏️ Aufgabe der Lehrkraft","🗂 Projektarbeit/Präsentation"];
const AUFG_SPRACHE=["📝 Vorbereiten","🔁 Nacharbeiten","📋 Hausaufgaben","✏️ Aufgabe der Lehrkraft","🔤 Vokabeln lernen/üben","🗂 Projektarbeit/Präsentation"];
const AUFG_SONSTIGES=["🗂️ Fach aufräumen","🎒 Ranzen aufräumen","📖 Lesen","🧹 Klassendienst"];
const SPRACH_FAECHER=["Deutsch","Englisch","Französisch","Spanisch","Latein","Dänisch"];
function aufgabenListeFuer(fach){
  const out=[];
  if(fach==="Sonstiges")return {ab:[],std:AUFG_SONSTIGES};
  // Nur ABs/Kurz-Checks, die wirklich zu DIESEM Fach gehören (kein Übernehmen des ersten NaWi-ABs mehr)
  const titel=[];(db.pakete||[]).forEach(p=>{if(p.fach===fach){const t=String(p.titel||"").replace(/^Kurz-Check\s*(Bronze|Silber|Gold)?\s*·?\s*/,"")||p.titel;if(t&&!titel.includes(t))titel.push(t)}});
  return {ab:titel.map(t=>"📄 "+t),std:SPRACH_FAECHER.includes(fach)?AUFG_SPRACHE:AUFG_STANDARD};
}
function aufgabenFuellen(vorher){
  const fs=document.getElementById("newSubject"),ts=document.getElementById("newTaskSel");if(!fs||!ts)return;
  const l=aufgabenListeFuer(fs.value);const o=x=>`<option value="${esc(x)}">${esc(x)}</option>`;
  let h=`<option value="">– bitte auswählen –</option>`;
  if(l.ab.length)h+=`<optgroup label="Arbeitsblätter / Kurz-Checks">${l.ab.map(o).join("")}</optgroup>`;
  h+=`<optgroup label="${fs.value==="Sonstiges"?"Sonstiges":"Typische Aufgaben"}">${l.std.map(o).join("")}</optgroup><option value="${FREI_AUFG}">✍️ ${FREI_AUFG}</option>`;
  ts.innerHTML=h;
  if(vorher&&[...ts.options].some(x=>x.value===vorher))ts.value=vorher;
  aufgabenFreitext();
}

function letzterEintrag(){

  for(const dt of dates){const l=db.tage[dt].eintraege||[];if(l.length)return l[l.length-1]}
  return null;
}

function letzteAufgaben(){

// --- Vergessene Timer früherer Tage anhalten ---
function fensterEndeTs(date){
  const h=db.einst.fensterEnde;if(!h||!/^\d{2}:\d{2}$/.test(h))return null;
  const [hh,mm]=h.split(":").map(Number);const d=new Date(date+"T00:00:00");d.setHours(hh,mm,0,0);return d.getTime();
}
function bereinigeAlteTimer(){
  let n=0;const heute=todayStr();
  Object.entries(db.tage).forEach(([date,d])=>{
    if(date>=heute)return;
    (d.eintraege||[]).forEach(e=>{
      if(e.status==="läuft"){schliesseSegment(e,fensterEndeTs(date));e.status="pausiert";e.autoBeendet=true;n++}
    });
  });
  if(n)setDirty();
  return n;
}
// --- Zeitfenster: Timer läuft nach Ende der Lernzeit noch? ---
let fensterSnoozeBis=0;
function pruefeFenster(){
  const ende=fensterEndeTs(todayStr());if(!ende)return;
  const jetzt=Date.now();if(jetzt<ende||jetzt<fensterSnoozeBis)return;
  if(document.getElementById("modalBack").classList.contains("open"))return;
  const laufend=ensureDay().eintraege.filter(e=>e.status==="läuft"&&e.aktiveSeit&&e.aktiveSeit<ende);
  if(!laufend.length)return;
  document.getElementById("modal").innerHTML=`<h2>⏰ Deine Lernzeit ist vorbei</h2>
    <p class="hint">Laut deinen Einstellungen endete die Lernzeit um <b>${esc(db.einst.fensterEnde)}</b> Uhr, aber ein Timer läuft noch. Bis wann hast du wirklich gearbeitet?</p>
    <div class="field"><label>Ende der Arbeitszeit</label><input type="time" id="fensterEndeInp" value="${esc(db.einst.fensterEnde)}"></div>
    <div class="topbar"><button class="btn primary" onclick="beendeLaufende(document.getElementById('fensterEndeInp').value,false)">✓ Timer dort anhalten</button><button class="btn" onclick="fensterSnoozeBis=Date.now()+30*60000;closeModal()">Ich arbeite noch</button></div>`;
  document.getElementById("modalBack").classList.add("open");
}
function beendeLaufende(hhmm,alsFertig){
  const now=Date.now();let ts=now;
  if(/^\d{2}:\d{2}$/.test(hhmm||"")){const [h,m]=hhmm.split(":").map(Number);const t=new Date();t.setHours(h,m,0,0);ts=Math.min(now,t.getTime())}
  ensureDay().eintraege.filter(e=>e.status==="läuft").forEach(e=>{
    schliesseSegment(e,ts);
    if(alsFertig){e.arbeitszeitMinuten=Math.round((e.gesamtMs||0)/60000);e.status="fertig";e.fertigAt=Math.max(ts,e.gestartetAt||ts)}
    else e.status="pausiert";
    if(activeTimer===e.id)activeTimer=null;
  });
  setDirty();closeModal();renderToday();
}

function korrPlus(x){const i=document.getElementById("korrMin");i.value=Math.max(0,Math.round(+i.value||0)+x)}
function zeitKorrSpeichern(id){
  const e=getEntry(id);if(!e)return;
  const v=Math.round(+document.getElementById("korrMin").value);
  if(!Number.isFinite(v)||v<0||v>600){alert("Bitte gib eine Zahl zwischen 0 und 600 ein.");return}
  const alt=calcMinutes(e);
  e.gesamtMs=v*60000;
  if(e.status==="läuft")e.aktiveSeit=Date.now();
  if(e.status==="fertig")e.arbeitszeitMinuten=v;
  if(v!==alt)e.zeitKorrigiert=true;
  setDirty();closeModal();renderToday();
}
// --- Tagesabschluss ---
function openTagesCheck(){
  const d=ensureDay();const fr=d.tagesrueckmeldung;
  const laufend=d.eintraege.filter(e=>e.status==="läuft");
  const offen=[];Object.entries(db.tage).forEach(([dt,x])=>{if(dt===currentDate)return;(x.eintraege||[]).forEach(e=>{if(e.status!=="fertig")offen.push(e)})});
  const p=[];
  if(!d.eintraege.length)p.push("Heute ist noch keine Arbeitsphase eingetragen.");
  laufend.forEach(e=>p.push("Timer läuft noch: "+e.fach+" – "+(e.aufgabe||"").slice(0,40)));
  const ohneAmpel=d.eintraege.filter(e=>!e.lernstand).length;
  if(ohneAmpel)p.push(ohneAmpel+" Arbeitsphase(n) ohne „Wie lief es?“-Ampel.");
  if(d.eintraege.length&&!fr.gut&&!fr.naechstesMal&&!fr.hindernisse)p.push("Die Tagesrückmeldung ist noch leer.");
  if(d.eintraege.length&&!fr.kiNutzung.genutzt)p.push("Die KI-Frage ist noch nicht beantwortet.");
  if(offen.length)p.push(offen.length+" offene Arbeitsphase(n) von früheren Tagen.");
  const tage=tageMitSicherung();
  if(d.eintraege.length&&(tage===null||tage>=7))p.push("Deine Datensicherung ist überfällig.");
  const j=new Date();const hhmm=String(j.getHours()).padStart(2,"0")+":"+String(j.getMinutes()).padStart(2,"0");
  document.getElementById("modal").innerHTML=`<h2>✅ Tagesabschluss</h2>
    ${p.length?`<ul class="hint" style="line-height:1.7;padding-left:18px">${p.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:`<div class="notice">✓ Alles erledigt – gut gemacht!</div>`}
    ${laufend.length?`<div class="field" style="margin-top:10px"><label>Laufende Timer beenden um</label><input type="time" id="abschlussZeit" value="${hhmm}"></div>
      <div class="topbar"><button class="btn primary" onclick="beendeLaufende(document.getElementById('abschlussZeit').value,true)">✓ Alle beenden</button><button class="btn" onclick="closeModal()">Später</button></div>`
    :`<div class="topbar"><button class="btn" onclick="closeModal()">Schließen</button><button class="btn primary" onclick="closeModal();saveJSON()">💾 Sichern</button></div>`}`;
  document.getElementById("modalBack").classList.add("open");
}
// --- Export: laufende Timer mit berechneten Minuten sichern (Sammelimport liest arbeitszeitMinuten/gesamtMs) ---
function exportDb(){
  const kopie=JSON.parse(JSON.stringify(db));const jetzt=Date.now();
  Object.values(kopie.tage).forEach(d=>(d.eintraege||[]).forEach(e=>{
    if(e.status==="läuft"&&e.aktiveSeit){
      const rest=Math.max(0,maxMs()-(e.gesamtMs||0));
      e.gesamtMs=(e.gesamtMs||0)+Math.min(Math.max(0,jetzt-e.aktiveSeit),rest);
      e.aktiveSeit=null;e.status="pausiert";
    }
    if(e.status!=="fertig"||e.arbeitszeitMinuten==null)e.arbeitszeitMinuten=Math.round((e.gesamtMs||0)/60000);
  }));
  return kopie;
}

/* ===== v0.3: Kurz-Check (selbstkorrigierend) und Erklär-Aufnahme ===== */
const AMPEL4=[["rot","🔴","noch unsicher"],["orange","🟠","fast"],["gelb","🟡","teilweise sicher"],["gruen","🟢","sicher"]];
function ensureKC(){if(!Array.isArray(db.pakete))db.pakete=[];if(!Array.isArray(db.checks))db.checks=[];if(!Array.isArray(db.audio))db.audio=[]}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function normTxt(s){return String(s==null?"":s).toLowerCase().replace(/ß/g,"ss").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim()}
function kcKurz(s,n){return String(s==null?"":s).slice(0,n||400)}
function kcName(){return [db.schueler.vorname,db.schueler.nachname].filter(Boolean).join(" ")}
// --- Paket prüfen und bereinigen (nur Daten, kein Code) ---
function kcPaketPruefen(p){
  if(!p||p.format!=="KLTB-KURZCHECK-1"||!Array.isArray(p.fragen)||!p.fragen.length||p.fragen.length>30)return null;
  const z=p.ziel||{};
  const out={format:"KLTB-KURZCHECK-1",id:kcKurz(p.id||("kc-"+hashStr(JSON.stringify(p.fragen))),60),titel:kcKurz(p.titel||"Kurz-Check",120),fach:kcKurz(p.fach||z.fach||"",60),
    ziel:{fach:kcKurz(z.fach||p.fach||"",60),jahrgang:kcKurz(z.jahrgang||"",10),block:kcKurz(z.block||"",120),kompetenz:kcKurz(z.kompetenz||"",160),niveau:["BR","SI","GO"].includes(z.niveau)?z.niveau:"BR"},fragen:[]};
  for(const f of p.fragen){
    if(!f||!f.frage)return null;
    const q={typ:f.typ,frage:kcKurz(f.frage,500),erklaerung:kcKurz(f.erklaerung||"",500)};
    if(f.typ==="zahl"){
      const vars=Array.isArray(f.varianten)&&f.varianten.length?f.varianten.slice(0,20).map(v=>{const o={};Object.keys(v||{}).slice(0,10).forEach(k=>{if(/^\w+$/.test(k))o[k]=typeof v[k]==="number"?v[k]:kcKurz(v[k],40)});return o}):[{loesung:f.loesung}];
      if(vars.some(v=>!isFinite(+v.loesung)))return null;
      q.varianten=vars;q.toleranz=Math.max(0,+f.toleranz||0);q.einheit=kcKurz(f.einheit||"",20);
    }else if(f.typ==="mc"){
      if(!Array.isArray(f.optionen)||f.optionen.length<2||f.optionen.length>6||!(f.richtig>=0&&f.richtig<f.optionen.length))return null;
      q.optionen=f.optionen.map(o=>kcKurz(o,200));q.richtig=+f.richtig;
    }else if(f.typ==="kurztext"){
      if(!Array.isArray(f.akzeptiert)||!f.akzeptiert.length)return null;
      q.akzeptiert=f.akzeptiert.slice(0,15).map(a=>kcKurz(a,60));q.muster=kcKurz(f.muster||f.akzeptiert[0],200);
    }else return null;
    out.fragen.push(q);
  }
  return out;
}

// Ausweg für Umgebungen ohne Mikrofon-Zugriff (z. B. Dokumente-App auf dem iPhone): fertige Aufnahme auswählen
function audioDauerLesen(file){
  return new Promise(res=>{
    let fertig=false;const url=URL.createObjectURL(file);const a=new Audio();a.preload="metadata";
    const ende=d=>{if(fertig)return;fertig=true;try{URL.revokeObjectURL(url)}catch(e){}res(isFinite(d)&&d>0?Math.round(d):0)};
    a.onloadedmetadata=()=>ende(a.duration);a.onerror=()=>ende(0);setTimeout(()=>ende(0),3000);a.src=url;
  });
}
async function audioDatei(event){

  const id=newId(),d=todayStr();

  db.audio.push({id,datum:d,ts:Date.now(),fach,thema,dauerSek:Math.min(dauer,600),mime:f.type||"",dateiname:String(f.name||"Aufnahme").slice(0,160),quelle:"datei"});

async function audioStart(){

  audioRec.mime=mime||"";audioRec.ext=/mp4/.test(mime)?"m4a":/ogg/.test(mime)?"ogg":"webm";audioRec.chunks=[];audioRec.blob=null;
  const mr=new MediaRecorder(audioRec.stream,mime?{mimeType:mime}:undefined);audioRec.mr=mr;
  mr.ondataavailable=e=>{if(e.data&&e.data.size)audioRec.chunks.push(e.data)};
  mr.onstop=()=>{
    clearInterval(audioRec.tick);audioRec.stream.getTracks().forEach(t=>t.stop());
    audioRec.blob=new Blob(audioRec.chunks,{type:audioRec.mime||"audio/webm"});
    if(audioRec.url)URL.revokeObjectURL(audioRec.url);audioRec.url=URL.createObjectURL(audioRec.blob);
    const pl=document.getElementById("audPlayer");if(pl){pl.src=audioRec.url;pl.style.display="block"}

}

  const pl=document.getElementById("audPlayer");if(!pl)return;if(audioRec.url)URL.revokeObjectURL(audioRec.url);audioRec.url=URL.createObjectURL(b);pl.src=audioRec.url;pl.style.display="block";pl.play().catch(()=>{});
}
async function audioTeilen(id){
  const a=db.audio.find(x=>x.id===id);const b=await audioBlob(id);if(!a||!b){alert("Diese Aufnahme liegt nicht in der App, sondern in deiner Sprachmemos-App bzw. bei den Dateien.");return}
  const file=new File([b],a.dateiname,{type:b.type||a.mime||"audio/webm"});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:a.dateiname});return}}catch(e){if(e&&e.name==="AbortError")return}
  const u=URL.createObjectURL(file);const l=document.createElement("a");l.href=u;l.download=a.dateiname;document.body.appendChild(l);l.click();setTimeout(()=>{URL.revokeObjectURL(u);l.remove()},800);
}
async function audioLoeschen(id){if(!confirm("Diese Aufnahme von deinem Gerät löschen?"))return;try{await idbDel(id)}catch(e){}db.audio=db.audio.filter(a=>a.id!==id);setDirty();audioOpen()}

try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}catch(e){}
